# Alembic CLI configuration, e.g. `alembic revision --autogenerate -m "..."` from the repo root.
# The database comes from DATABASE_URL (see backend/.env.example). To apply migrations, prefer
# `python -m backend.app.db.migrate`: it also adopts databases created before migrations existed.
[alembic]
script_location = %(here)s/backend/app/db/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
